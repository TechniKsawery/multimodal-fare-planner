# Test Warszawa+Kraków: docker compose -f docker-compose.pl-cities.yml --profile import-pl-cities run --rm motis-import-pl-cities ; potem up -d motis-pl-cities (port 8082)
volumes:
  motis-data-pl-cities:

services:
  motis-import-pl-cities:
    image: ${MOTIS_IMAGE:-ghcr.io/motis-project/motis@sha256:594eff881d4319549387563a28dffb2ac48650df5422325a44a6c2f69f79e9b9}
    entrypoint: /motis
    command: ["import", "-d", "/data", "-c", "/data/config.yml"]
    volumes:
      - "./data/osm:/input/osm:ro"
      - "./data/gtfs:/input/gtfs:ro"
      - motis-data-pl-cities:/data
      - ./motis/config.pl-cities.yml:/data/config.yml:ro
    profiles: ["import-pl-cities"]

  motis-pl-cities:
    image: ${MOTIS_IMAGE:-ghcr.io/motis-project/motis@sha256:594eff881d4319549387563a28dffb2ac48650df5422325a44a6c2f69f79e9b9}
    ports:
      - "8082:8080"
    volumes:
      - motis-data-pl-cities:/data
      - ./motis/config.pl-cities.yml:/data/config.yml:ro
