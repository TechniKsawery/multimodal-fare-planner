# motis-data jest wolumenem nazwanym (nie bind mountem), bo OSM/street_routing
# buduje duże memory-mapped pliki, które trzeba w locie powiększać (resize) —
# bind mounty Docker Desktop na Windows (gRPC-FUSE/VirtioFS) tego nie
# obsługują poprawnie i import kończy się błędem "resize error".
volumes:
  motis-data:

services:
  motis-import:
    image: ${MOTIS_IMAGE:-ghcr.io/motis-project/motis@sha256:594eff881d4319549387563a28dffb2ac48650df5422325a44a6c2f69f79e9b9}
    entrypoint: /motis
    command: ["import", "-d", "/data", "-c", "/data/config.yml"]
    volumes:
      - ./data:/input:ro
      - motis-data:/data
      - ./motis/config.yml:/data/config.yml:ro
    profiles: ["import"]

  motis:
    image: ${MOTIS_IMAGE:-ghcr.io/motis-project/motis@sha256:594eff881d4319549387563a28dffb2ac48650df5422325a44a6c2f69f79e9b9}
    ports:
      - "8080:8080"
    volumes:
      - motis-data:/data
      - ./motis/config.yml:/data/config.yml:ro
